# Street parking monitor — site configuration.
# Hand-edit this file. Every key is optional: anything omitted falls back to
# streetmon/config.py:DEFAULTS. Parking-space polygons live in config/zones.yaml
# (generated by tools/zones_editor.py), not here.

site:
  name: street-cam-01
  notes: "Logitech BRIO, 2nd-floor window, pointed at the far curb."

camera:
  device: 0
  fourcc: MJPG            # MJPG is the only format the BRIO offers above 1080p
  # 4K capture: measured 30.1 fps sustained, detection still 19 ms (YOLO
  # resizes internally), H.264 encode 86 fps. Events are written at this full
  # resolution so that fleet unit numbers (S3-24-04 vs S3-24-15) have a chance
  # of being resolvable; the timelapse is downscaled to capture.timelapse_width.
  width: 3840
  height: 2160
  fps: 30
  warmup_frames: 10

  # Shooting through window glass: autofocus can hunt on the pane itself and
  # auto-exposure swings hard when a bright vehicle enters frame. Run
  # `python tools/aim.py` to find good fixed values, then set them here.
  autofocus: true
  focus: null             # 0..255, used only when autofocus is false
  auto_exposure: true
  exposure: null          # absolute exposure, used only when auto_exposure is false
  zoom: null              # BRIO digital zoom, 100..500 (null = leave alone)

detector:
  model: yolo11m.pt       # 14 ms/frame at 960px on the Radeon 8060S iGPU
  device: 0               # ROCm GPU index, or "cpu"
  imgsz: 960
  conf: 0.30
  iou: 0.50
  tracker: bytetrack.yaml
  # Standard NMS uses IoU, which is blind to containment: a roofline slice
  # detected as its own car scored IoU 0.187 against the real car but was 94%
  # inside it, so NMS kept both. These two filters remove that artifact.
  nested_contained_min: 0.80  # a box this far inside another may be a duplicate...
  nested_conf_margin: 0.25    # ...but only if also this much less confident.
                              # Containment alone deletes real cars: a distant
                              # vehicle often sits inside a near one's box.
  aspect_max: 3.5         # side-on cars are 1.8-2.6; 4+ is a sliver
  aspect_min_conf: 0.60   # only reject a freakish shape if confidence is low too
  # COCO ids: 0 person, 1 bicycle, 2 car, 3 motorcycle, 5 bus, 7 truck
  classes: [0, 1, 2, 3, 5, 7]
  vehicle_classes: [1, 2, 3, 5, 7]

capture:
  detect_fps: 4.0         # detector sample rate; camera still runs at camera.fps
  timelapse_width: 1920   # timelapse frames are downscaled to this width
  timelapse_sec: 10       # always-on full-frame snapshot interval
  log_every_n: 1          # write every Nth detection sample to detections.jsonl

  event:                  # high-rate burst around arrivals, departures, pass-bys
    enabled: true
    fps: 5.0
    pre_roll_sec: 2.0
    post_roll_sec: 5.0
    max_sec: 90
    trigger_on_new_vehicle: true
    quality: 24           # H.264 qp (lower = better, larger). 24 measured ~35x smaller than JPEG
    width: 1920           # event clips are written at this width (0 = full capture
                          # resolution). Capture stays 4K so crops keep their detail.
    trigger_on_person: true   # a pedestrian in motion also opens an event

  crops:                  # per-vehicle cutouts — the training set for goal 2
    enabled: true
    max_per_track: 8
    min_interval_sec: 2.0
    min_box_px: 48        # at 1920 wide; scaled automatically with resolution
    pad: 0.08
    jpeg_quality: 92
    persons: true         # officers work on foot too, so keep person crops
    min_box_px_person: 32 # people are narrower than cars; lower floor for them

triage:
  # Colour prefilter for the Ville de Quebec enforcement fleet, tuned against
  # real photos of the vehicles (captures-manual/parking-police/).
  #
  # NOTE: an earlier version looked for blue markings. Measured on the actual
  # vehicles the blue crest scores 0.000 at street scale while civilian blue
  # cars score up to 0.58 -- it rejected every true positive. The real signal
  # is a dashed RED stripe along the mid-body, on both the Civic and the Rogue.
  # Thresholds below sit mid-plateau of a 100%-recall / 0-FP region measured on
  # 10 positives vs 38 negatives. Still a prefilter, not a classifier.
  enabled: true
  white_min_frac: 0.18      # police 0.24-0.47, ordinary traffic median 0.07
  red_band_min_frac: 0.012  # police 0.017-0.042, negatives 0.000
  white_sat_max: 45
  white_val_min: 165
  red_hue_lo: 8             # hue wraps the circle: <=8 or >=172 counts as red
  red_hue_hi: 172
  red_sat_min: 110
  red_val_min: 70
  band_top: 0.45            # mid-body rows only -- excludes brake/tail lights
  band_bottom: 0.85
  # Recorded in the logs but not gated on: the crest is too small to rely on.
  blue_hue: [95, 135]
  blue_sat_min: 90
  blue_val_min: 55

schedule:
  # From the sign on this street: "P 90 min / 9h-17h / LUN a VEN", plus a
  # green plate exempting Zone 3 permit holders. One hour of margin either side
  # catches an early first sweep or a late last one.
  enabled: true
  active:
    - label: enforcement
      days: [mon, tue, wed, thu, fri]
      start: "08:00"
      end: "18:00"
  idle:
    timelapse_sec: 300      # keep watching overnight, just sparsely
    events: false           # no event clips outside active hours
    crops: false

kinematic:
  # The behavioural half of parking-police triage, independent of livery.
  # Speed is in body-lengths/sec (box displacement / box width), which is
  # scale-invariant: a car across the street and a car under the window give
  # the same reading at the same real speed. A 4.5 m car at 30 km/h is
  # ~1.9 BL/s; a patrol crawl at 10 km/h is ~0.6 BL/s.
  enabled: true
  patrol_max_bl_s: 1.0      # flag transits slower than this (~16 km/h)
  min_travel_bl: 3.0        # ignore anything that never really moved
  min_duration_sec: 3.0
  min_stops_for_flag: 1     # a mid-street stop is suspicious on its own
  expire_sec: 8.0

curb:
  # No painted bays on this street: parking is modelled as intervals along a
  # line and free space as the gaps between them. Curb lines are auto-fitted
  # from where cars actually park (config/curb.yaml) and the pixels-per-metre
  # scale is learned from passing traffic (config/curb_calibration.json),
  # using each car as a ~4.5 m ruler.
  enabled: true
  max_perp_px: 260        # how far off the line a vehicle may sit (at 1920 wide)
  min_gap_m: 5.4          # a 4.5 m car plus room to manoeuvre
  scale_bins: 12
  scale_min_samples: 8
  scale_max_per_bin: 400  # recent samples kept per bin. Not just a size cap:
                          # an unbounded history cannot adapt, because a new
                          # sample would have to outvote every past one to move
                          # the median. A sliding window re-converges in hours
                          # if the camera is ever nudged.
  gap_confirm_sec: 8.0    # a gap must persist this long to be reported.
                          # Sample-count hysteresis (0.75 s) was too short: a
                          # parked car occluded by a passing van produced a
                          # phantom 8.2 m space that vanished 750 ms later.
  log_interval_sec: 30

storage:
  root: data
  jpeg_quality: 85
  min_free_gb: 50         # pause writing below this; prune if retention allows
  retention_days: 0       # 0 = never auto-delete. Only used when disk drops below min_free_gb.
  rotate_daily: true      # start a fresh session directory at local midnight
